<div
  class="app"
  [class.dark]="isDark"
  [class.motion-paused]="animationsPaused"
  [class.search-page]="isSearchPage"
  [class.article-page]="isArticlePage"
  [class.article-principles]="articleKey === 'principles'"
  [class.article-assistive]="articleKey === 'assistive-technology'"
  [class.search-results-active]="isSearchPage && hasSearchResults"
>
  <a
    class="skip-link"
    [href]="isSearchPage ? '/search.html#main_content' : '/#main_content'"
    aria-label="skip to main content"
    (click)="skipToTarget($event)"
  >Skip to main content</a>

  <app-navigation
    [isSearchPage]="isSearchPage"
    [isArticlePage]="isArticlePage"
    [isDark]="isDark"
    [animationsPaused]="animationsPaused"
    (searchRequested)="openSearch($event)"
    (homeRequested)="scrollHome($event)"
    (themeToggled)="toggleTheme()"
    (animationsToggled)="toggleAnimations()"
  />

  <div #pageContent class="page-content page-content-height" (scroll)="onPageContentScroll()">
    <div class="page-body">
      <app-search-page [isSearchPage]="isSearchPage" (resultsChanged)="hasSearchResults = $event" />
      @if (articleKey; as key) {
        <app-foundation-article
          [articleKey]="key"
          [scrollContainer]="pageContent"
          (articleRequested)="openArticle($event.event, $event.path)"
        />
      }
      <app-home-page
        [isSearchPage]="isSearchPage"
        [isArticlePage]="isArticlePage"
        [animationsPaused]="animationsPaused"
      />
      <app-footer (homeRequested)="scrollHome($event)" />
    </div>
  </div>
</div>
